<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo de Animes</title>
    <!-- Fonte Moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎌 Quiz Mestre dos Animes</h1>
        <p>Prove que você é um verdadeiro Otaku!</p>
    </header>

    <main>
        <!-- Seção do Quiz -->
        <section id="quiz-section" aria-live="polite">
            <article class="quiz-card glass-panel">
                <!-- Barra de Progresso -->
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>

                <div class="header-quiz">
                    <span id="question-number" class="badge">Pergunta 1/20</span>
                    <span id="score-realtime" class="badge score-badge">⭐ Pontos: 0</span>
                </div>
                
                <h2 id="question-text">Carregando pergunta...</h2>
                
                <form id="options-form">
                    <div id="options-container" class="options-grid">
                        <!-- Botões gerados pelo JS -->
                    </div>
                </form>

                <div id="feedback" class="feedback-msg"></div>
                
                <button id="next-btn" class="action-btn" disabled>Próxima Pergunta ➔</button>
            </article>
        </section>

        <!-- Seção de Resultados -->
        <section id="result-section" class="hidden">
            <article class="result-card glass-panel">
                <h2>Fim de Jogo!</h2>
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135684.png" alt="Troféu de ouro brilhante" class="trophy-img">
                <h3 id="final-score" class="gradient-text">Você acertou X de 20.</h3>
                <p id="result-message"></p>
                <button id="restart-btn" class="action-btn">🔄 Jogar Novamente</button>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido para Fãs de Animes.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
