<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Anime Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link para o seu arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen flex items-center justify-center overflow-hidden font-sans relative">
    
    <!-- Partículas Animadas de Fundo -->
    <div class="particles-container" id="particles"></div>

    <!-- Container Principal (Glassmorphism) -->
    <div class="glass-panel w-full max-w-2xl p-8 rounded-3xl shadow-2xl relative z-10 mx-4">
        
        <!-- Tela de Início -->
        <div id="start-screen" class="text-center slide-in">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
                Ultimate Anime Quiz
            </h1>
            <p class="text-lg text-gray-300 mb-8">Prove seu valor! Responda 20 perguntas e descubra seu verdadeiro Nível Otaku.</p>
            <button id="start-btn" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 px-8 rounded-full transition-transform transform hover:scale-105 shadow-lg">
                Começar o Quiz
            </button>
        </div>

        <!-- Tela do Quiz -->
        <div id="quiz-screen" class="hidden slide-in">
            <div class="flex justify-between items-center mb-4">
                <span id="question-tracker" class="text-sm font-semibold text-purple-300">Questão 1/20</span>
                <span id="score-tracker" class="text-sm font-semibold text-pink-300">Pontos: 0</span>
            </div>
            <!-- Barra de Progresso -->
            <div class="w-full bg-gray-700 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-gradient-to-r from-purple-500 to-pink-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <h2 id="question-text" class="text-2xl md:text-3xl font-bold mb-6 text-center text-gray-100 min-h-[80px]">
                <!-- Pergunta aparecerá aqui -->
            </h2>

            <div id="options-container" class="grid gap-4">
                <!-- Botões das opções aparecerão aqui -->
            </div>
        </div>

        <!-- Tela de Fim -->
        <div id="end-screen" class="hidden text-center slide-in">
            <h1 class="text-4xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">
                Parabéns!
            </h1>
            <p class="text-xl mb-4 text-gray-300">Você concluiu o quiz.</p>
            
            <div class="glass-panel p-6 mb-6 rounded-2xl bg-white/5 inline-block w-full">
                <p class="text-lg text-gray-400 mb-1">Você acertou</p>
                <p id="final-score" class="text-4xl font-bold text-white mb-4">0/20</p>
                <p class="text-sm text-gray-400 uppercase tracking-widest mb-1">Seu Nível Otaku é</p>
                <h2 id="otaku-level" class="text-3xl font-black uppercase tracking-wider">
                    <!-- Nível aparecerá aqui -->
                </h2>
                <p id="level-description" class="text-sm text-gray-300 mt-3"></p>
            </div>

            <button id="restart-btn" class="bg-gradient-to-r from-blue-600 to-green-600 hover:from-blue-500 hover:to-green-500 text-white font-bold py-3 px-8 rounded-full transition-transform transform hover:scale-105 shadow-lg">
                Tentar Novamente
            </button>
        </div>

    </div>

    <!-- Link para o seu arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
